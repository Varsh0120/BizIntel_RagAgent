services:
  - type: web
    name: bizintel-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: AUTH_API_KEY
        sync: false
      - key: DATABASE_API_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: documents
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-20b
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VECTOR_DB_PROVIDER
        value: qdrant
      - key: QDRANT_CLOUD_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: enterprise_knowledge
      - key: QDRANT_VECTOR_SIZE
        value: 1024
      - key: EMBEDDING_PROVIDER
        value: jina
      - key: JINA_API_KEY
        sync: false
      - key: JINA_EMBEDDING_MODEL
        value: jina-embeddings-v3
      - key: JINA_TIMEOUT_SECONDS
        value: 60
      - key: RERANKER_PROVIDER
        value: jina
      - key: JINA_RERANKER_MODEL
        value: jina-reranker-v2-base-multilingual

  - type: web
    name: bizintel-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
